<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logo Lab</title>
<style>
/* Layout: a press-check report. Verdict first (specimen on a proof sheet + the numbers), then the tests grouped
   by question, each test one proof figure with a caption. Accent = process magenta, used only for marks. */
:root {
  --paper: #eef0f3; --sheet: #ffffff; --ink: #15171c; --ink-2: #3a3f49; --muted: #646b78; --rule: #dadee5; --rule-2: #c5cad3;
  --accent: #d0126c; --accent-soft: #fbe3ee; --ok: #12784f; --ok-soft: #dff3ea; --warn: #a65f00; --warn-soft: #fbefdc; --bad: #c0261b; --bad-soft: #fbe4e1;
  --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-text: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px; --shadow: 0 1px 2px rgba(21,23,28,.06), 0 8px 24px -12px rgba(21,23,28,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #101216; --sheet: #191c22; --ink: #eceef2; --ink-2: #c7ccd5; --muted: #949baa; --rule: #2a2f38; --rule-2: #3a404b;
  --accent: #ff4f9b; --accent-soft: #3a1527; --ok: #4fd09a; --ok-soft: #12291f; --warn: #f0a540; --warn-soft: #33240e; --bad: #ff7b6e; --bad-soft: #3a1714;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #101216; --sheet: #191c22; --ink: #eceef2; --ink-2: #c7ccd5; --muted: #949baa; --rule: #2a2f38; --rule-2: #3a404b;
  --accent: #ff4f9b; --accent-soft: #3a1527; --ok: #4fd09a; --ok-soft: #12291f; --warn: #f0a540; --warn-soft: #33240e; --bad: #ff7b6e; --bad-soft: #3a1714;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--f-text); font-feature-settings: "cv11", "ss01" }
button, input { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)) }

/* top bar */
.bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule) }
.bar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap }
.mark { display: flex; align-items: center; gap: 10px; font: 700 17px/1 var(--f-display); letter-spacing: -.01em; margin-right: auto; min-width: 0 }
.mark svg { flex: none }
.mark .file { font: 500 12px/1 var(--f-mono); color: var(--muted); padding: 5px 8px; border: 1px solid var(--rule); border-radius: 6px; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--rule-2); background: var(--sheet); cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap }
.btn:hover { border-color: var(--ink-2) }
.btn.primary { background: var(--ink); color: var(--sheet); border-color: var(--ink) }
.btn.primary:hover { background: var(--ink-2) }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted) }
.btn.ghost:hover { color: var(--ink) }
.btn[disabled] { opacity: .45; pointer-events: none }
.btn svg { width: 16px; height: 16px }

/* section nav */
.nav { display: flex; gap: 6px; overflow-x: auto; padding-block: 0 10px; scrollbar-width: none }
.nav a { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap; border: 1px solid transparent }
.nav a:hover { border-color: var(--rule-2) }
.nav a .n { font: 500 11px/1 var(--f-mono); padding: 3px 6px; border-radius: 999px; background: var(--warn-soft); color: var(--warn) }
.nav a .n.zero { background: var(--ok-soft); color: var(--ok) }

/* report (verdict) */
.report { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; padding-block: 24px 8px }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow) }
.specimen { padding: 18px; display: flex; flex-direction: column; gap: 14px }
.proof { position: relative; aspect-ratio: 1; border-radius: 6px; display: grid; place-items: center; overflow: hidden; transition: background .2s }
.proof img { width: 58%; height: 58%; object-fit: contain }
.proof .crop { position: absolute; width: 22px; height: 22px; border-color: var(--accent); border-style: solid; border-width: 0; opacity: .9 }
.proof .crop.tl { top: 14px; left: 14px; border-top-width: 1px; border-left-width: 1px }
.proof .crop.tr { top: 14px; right: 14px; border-top-width: 1px; border-right-width: 1px }
.proof .crop.bl { bottom: 14px; left: 14px; border-bottom-width: 1px; border-left-width: 1px }
.proof .crop.br { bottom: 14px; right: 14px; border-bottom-width: 1px; border-right-width: 1px }
.proof .reg { position: absolute; top: 50%; right: 10px; width: 16px; height: 16px; margin-top: -8px; border: 1px solid var(--accent); border-radius: 50% }
.proof .reg::before, .proof .reg::after { content: ""; position: absolute; background: var(--accent) }
.proof .reg::before { left: 50%; top: -5px; bottom: -5px; width: 1px }
.proof .reg::after { top: 50%; left: -5px; right: -5px; height: 1px }
.swatches { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.swatches .lbl { font-size: 12px; color: var(--muted); margin-right: 4px }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--rule-2); cursor: pointer; padding: 0 }
.sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px }
.fields { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: end }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.field span { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.field input[type=text] { height: 34px; padding: 0 10px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--paper); min-width: 0 }
.field input[type=color] { width: 44px; height: 34px; border: 1px solid var(--rule-2); border-radius: 8px; padding: 3px; background: var(--paper); cursor: pointer }

.verdict { padding: 24px 26px; display: flex; flex-direction: column; gap: 18px; min-width: 0 }
.eyebrow { font: 600 11px/1 var(--f-text); letter-spacing: .09em; text-transform: uppercase; color: var(--muted) }
.headline { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap }
.big { font: 700 clamp(56px, 7vw, 88px)/.85 var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.big small { font-size: .32em; font-weight: 500; color: var(--muted); letter-spacing: 0 }
.minsize { display: flex; flex-direction: column; gap: 6px }
.minsize b { font: 700 32px/1 var(--f-display); font-variant-numeric: tabular-nums }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font: 600 12px/1 var(--f-text) }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50% ; background: currentColor }
.pill.ok { background: var(--ok-soft); color: var(--ok) } .pill.warn { background: var(--warn-soft); color: var(--warn) } .pill.bad { background: var(--bad-soft); color: var(--bad) } .pill.info { background: var(--paper); color: var(--muted) }
.lead { font-size: 15.5px; line-height: 1.55; max-width: 62ch; margin: 0; text-wrap: pretty }
.ruler { position: relative; height: 54px; margin-top: 4px }
.ruler .track { position: absolute; left: 0; right: 0; top: 18px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--bad-soft), var(--warn-soft) 45%, var(--ok-soft)); border: 1px solid var(--rule) }
.ruler .zone { position: absolute; top: 18px; height: 10px; border-radius: 5px; background: var(--ok); opacity: .9 }
.ruler .tick { position: absolute; top: 32px; transform: translateX(-50%); font: 500 11px/1 var(--f-mono); color: var(--muted) }
.ruler .tick::before { content: ""; position: absolute; left: 50%; top: -6px; width: 1px; height: 4px; background: var(--rule-2) }
.ruler .pin { position: absolute; top: 2px; transform: translateX(-50%); font: 600 11px/1 var(--f-mono); color: var(--accent); white-space: nowrap }
.ruler .pin.start { transform: none } .ruler .pin.start::after { left: 0 }
.ruler .pin::after { content: ""; position: absolute; left: 50%; top: 14px; width: 2px; height: 16px; margin-left: -1px; background: var(--accent) }
.measures { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.measure { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.measure.limit { border-color: var(--accent); background: var(--accent-soft) }
.measure .v { font: 600 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums }
.measure .s { font-size: 12px; color: var(--muted) }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--rule); margin: 0 }
.stats div { padding: 10px 0; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; padding-right: 10px }
.stats dt { font-size: 12px; color: var(--muted) } .stats dd { margin: 0; font: 500 14px/1.3 var(--f-mono); font-variant-numeric: tabular-nums }
.fine { font-size: 12px; color: var(--muted); margin: 0 }
.pdfopts { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--rule); padding-top: 14px }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); cursor: pointer }
.check input { margin-top: 3px; accent-color: var(--accent) }
.field textarea { padding: 8px 10px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--paper); font: inherit; resize: vertical; min-height: 56px }
details.how { border-top: 1px solid var(--rule); padding-top: 10px }
details.how summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2) }
details.how p { font-size: 13px; color: var(--muted); margin: 8px 0 0; max-width: 70ch }

/* drop state */
.drop { display: grid; place-items: center; text-align: center; gap: 14px; padding: 56px 24px; border: 1.5px dashed var(--rule-2); border-radius: var(--r); background: var(--sheet); margin-block: 24px }
.drop h1 { font: 700 30px/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance }
.drop p { margin: 0; color: var(--muted); max-width: 52ch }
.drop .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center }
body.dragging .drop, body.dragging .report { outline: 2px dashed var(--accent); outline-offset: 6px }

/* tests */
.section { padding-block: 28px 4px; scroll-margin-top: 110px }
.section-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px }
.section-head h2 { font: 700 22px/1.2 var(--f-display); letter-spacing: -.015em; margin: 0 }
.section-head p { margin: 0; color: var(--muted); max-width: 70ch }
.tests { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 16px }
.test { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0 }
.test.wide { grid-column: 1 / -1 }
.test header { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; min-height: 52px }
.test h3 { font: 600 14px/1.3 var(--f-text); margin: 0; margin-right: auto }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--paper); border: 1px solid var(--rule) }
.seg button { border: 0; background: transparent; padding: 4px 9px; border-radius: 5px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12) }
.stage { margin: 0 14px; border-radius: 6px; overflow: hidden; background: #fff; border: 1px solid var(--rule); line-height: 0 }
.stage canvas { width: 100%; height: auto; display: block }
.test footer { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px }
.readout { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.chip { font: 500 12px/1 var(--f-mono); padding: 5px 8px; border-radius: 6px; background: var(--paper); color: var(--ink-2); font-variant-numeric: tabular-nums }
.test .note { font-size: 12.5px; color: var(--muted); margin: 0; text-wrap: pretty }
.slider { display: flex; align-items: center; gap: 10px; padding: 10px 14px 0 }
.slider input { flex: 1; accent-color: var(--accent) }
.slider output { font: 500 12px/1 var(--f-mono); color: var(--ink-2); white-space: nowrap; text-align: right }
.slider { flex-wrap: wrap }
.slider input { min-width: 140px }
pre.src { margin: 0 14px; max-height: 300px; overflow: auto; padding: 12px; border-radius: 6px; background: var(--paper); border: 1px solid var(--rule); font: 12px/1.55 var(--f-mono); white-space: pre-wrap; word-break: break-all; color: var(--ink-2) }
.kit { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px }
footer.page { padding-block: 36px 48px; color: var(--muted); font-size: 12px }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--sheet); padding: 10px 14px; border-radius: 8px; font-size: 13px; transition: .25s; pointer-events: none; z-index: 50 }
.toast.on { opacity: 1; transform: translateX(-50%) }

@media (max-width: 1080px) { .tests { --cols: 2 !important } }
@media (max-width: 980px) { .report { grid-template-columns: 1fr } .proof { max-height: 420px; aspect-ratio: auto; height: 340px } }
@media (max-width: 720px) { .tests { --cols: 1 !important } .test.wide { grid-column: auto } .measures { grid-template-columns: 1fr } .stats { grid-template-columns: 1fr 1fr } .fields { grid-template-columns: 1fr 1fr } .fields .field:first-child { grid-column: 1 / -1 } .mark .file { display: none } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>
<body>
<div class="bar">
  <div class="wrap">
    <div class="mark">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 0v6M11 16v6M0 11h6M16 11h6" stroke="var(--accent)" stroke-width="1.6"/></svg>
      <span>Logo Lab</span><span class="file" id="fname"></span>
    </div>
    <button class="btn ghost" id="lang" type="button" aria-label="Language">IT</button>
    <label class="btn" for="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 20h16"/></svg><span data-t="open"></span></label>
    <input type="file" id="open" accept=".svg,.png,image/svg+xml,image/png" hidden>
    <button class="btn primary" id="pdf" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v12m0 0 4-4m-4 4-4-4M4 20h16"/></svg><span data-t="pdf"></span></button>
  </div>
  <div class="wrap"><nav class="nav" id="nav"></nav></div>
</div>
<main class="wrap" id="main"></main>
<div class="wrap"><footer class="page" id="foot"></footer></div>
<div class="toast" id="toast" role="status"></div>
<script>
window.DATA = null;
"use strict";
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hexToRgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); }
function lum([r, g, b]) { const f = c => { c /= 255; return c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; }; return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
if (!window.DATA) window.DATA = null;

// ---------------- i18n ----------------
const I18N = {
  en: {

    fid16: 'Fidelity at 16 px', fid32: 'Fidelity at 32 px', parts: 'Parts, full → 32 px', fill: 'Fill ratio', sym: 'Mirror symmetry', neg: 'Negative space', counters: 'counters', counter: 'counter',

    belowMin: 'below minimum', light: 'Light', dark: 'Dark', gridOn: 'Grid', gridOff: 'No grid', onBrand: 'On brand colour', tonal: 'Tonal',
    paper: 'Paper', kraft: 'Kraft', concrete: 'Concrete', chalk: 'Chalk', metal: 'Metal', emboss: 'Emboss', deboss: 'Deboss', copy: 'Copy SVG', copied: 'Copied',
    secLeg: 'Size & legibility', secLegP: 'Where the mark stops working as it gets smaller or blurrier.',

    secRep: 'Reproduction', secRepP: 'One ink, materials and print processes.',

    tScale: 'Scale ladder', nScale: 'Crisp renders from 128 to 16 px. Sizes below the minimum are marked.',
    tPix: 'Real pixels', nPix: '16, 32 and 48 px renders enlarged without smoothing: what a browser tab or toolbar shows.',
    tBlur: 'Vision blur', nBlur: 'Loss of sharpness from distance, low vision or motion. A strong mark keeps its silhouette after the details are gone.',
    blur: ['Clear: normal vision', 'Soft: mild impairment', 'Blurred: low vision', 'Heavy: severe impairment', 'Silhouette only'],
    tNeg: 'Negative space', nNeg: 'Ink in black, enclosed counters in colour. Small counters close first; an intended negative-space idea should still read here.',
    tWeight: 'Visual weight', nWeight: 'Where the mass sits. The cross is the centre of mass, the ring the geometric centre: a large gap looks off-centre in a square crop.',

    tCard: 'Business card & badge', nCard: 'An 85 × 55 mm card and an ID badge, at matching proportions.',

    tPat: 'Pattern', nPat: 'The mark repeated as a pattern. Strong marks often make good patterns; awkward gaps show here.',

    tMono: 'One colour & reversed', nMono: 'A mechanical recolour in one ink and reversed. If the idea disappears, the mark needs a designed one-colour version.', monoWarn: 'overlapping colours merge',
    tMat: 'Materials', nMat: 'Uncoated paper, kraft, concrete, chalkboard and brushed metal. Watch thin parts and low-contrast colours.',
    tEmb: 'Emboss & deboss', nEmb: 'Blind emboss or deboss with no colour: only the shape and its edges carry the mark.',
    tHalf: 'Halftone', nHalf: 'A coarse dot screen, as in newsprint, screen printing and low-resolution reproduction.',

const SECTIONS = [['leg', 'secLeg', 'secLegP'], ['form', 'secForm', 'secFormP'], ['ctx', 'secCtx', 'secCtxP'], ['rep', 'secRep', 'secRepP'], ['file', 'secFile', 'secFileP']];

const NOTES = Object.fromEntries(Object.entries(TITLES).map(([k, v]) => [k, 'n' + v.slice(1)]));
const LIVE = {}; // id -> { opt, val, info, canvas }

function showDrop() {
  $('#nav').innerHTML = ''; $('#fname').textContent = ''; $('#pdf').disabled = true;
  $('#main').innerHTML = `<section class="drop"><h1>${t('dropTitle')}</h1><p>${t('dropSub')}</p><div class="row"><label class="btn primary" for="open">${t('choose')}</label><button class="btn" id="sample" type="button">${t('sample')}</button></div></section>`;
  $('#sample').onclick = () => loadSvgText(SAMPLE, 'sample.svg', true);
}

function render() {
  if (M.empty) { toast('No visible shapes found in this file.'); return; }
  $('#pdf').disabled = false;
  const main = $('#main'); main.innerHTML = '';
  main.appendChild(reportEl());
  const counts = {};
  for (const [sec, title, intro] of SECTIONS) {
    const el = document.createElement('section'); el.className = 'section'; el.id = 's-' + sec;
    el.innerHTML = `<div class="section-head"><h2>${t(title)}</h2><p>${t(intro)}</p></div><div class="tests"></div>`; main.appendChild(el);
    const grid = el.querySelector('.tests'); counts[sec] = 0;
    const n = TESTS.filter(x => x.sec === sec && !x.wide && (!x.svgOnly || DATA.svg)).length + (sec === 'file' ? (DATA.svg ? 2 : 1) : 0);
    grid.style.setProperty('--cols', n % 3 === 0 ? 3 : n % 2 === 0 ? 2 : 3);
    for (const T of TESTS.filter(x => x.sec === sec).sort((a, b) => (b.wide ? 1 : 0) - (a.wide ? 1 : 0))) { if (T.svgOnly && !DATA.svg) continue; const st = testEl(T, grid); if (st === 'warn' || st === 'bad') counts[sec]++; }
    if (sec === 'file') fileTests(grid);
  }
  $('#nav').innerHTML = `<a href="#report">${t('scal')}</a>` + SECTIONS.map(([sec, title]) => `<a href="#s-${sec}">${t(title)}${sec === 'file' ? '' : `<span class="n${counts[sec] ? '' : ' zero'}">${counts[sec] ? '!' + counts[sec] : '✓'}</span>`}</a>`).join('');
  document.title = 'Logo Lab — ' + (state.sample ? t('sampleTag') : DATA.file);
}

// ---------------- PDF export (self-contained writer: Helvetica text + JPEG figures) ----------------
const WINANSI = { 0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87, 0x02C6: 0x88, 0x2030: 0x89, 0x0160: 0x8A, 0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E, 0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97, 0x02DC: 0x98, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x0153: 0x9C, 0x017E: 0x9E, 0x0178: 0x9F };
function winAnsi(s) { s = String(s).replace(/→/g, '->').replace(/≥/g, '>=').replace(/≤/g, '<=').replace(/✓/g, 'OK').replace(/≈/g, '~').replace(/ | /g, ' ');
  let o = ''; for (const ch of s) { const c = ch.codePointAt(0); o += String.fromCharCode(c < 128 || (c >= 160 && c < 256) ? c : WINANSI[c] || 63); } return o; }
function pdfStr(s) { return '(' + winAnsi(s).replace(/[\\()]/g, m => '\\' + m) + ')'; }
function textW(s, size, bold) { let w = 0; for (const ch of s) { const c = ch; w += /[il.,:;!|'’ ]/.test(c) ? (c === ' ' ? .278 : .25) : /[fjrt()\-]/.test(c) ? .333 : /[mwMW]/.test(c) ? .85 : /[A-Z]/.test(c) ? .68 : /[0-9]/.test(c) ? .556 : .5; } return w * size * (bold ? 1.06 : 1); }
function wrap(s, size, width, bold) { const words = String(s).split(/\s+/), lines = []; let cur = ''; for (const w of words) { const tryS = cur ? cur + ' ' + w : w; if (textW(tryS, size, bold) > width && cur) { lines.push(cur); cur = w; } else cur = tryS; } if (cur) lines.push(cur); return lines; }
function jpegOf(cv, maxW = 1100) { const k = Math.min(1, maxW / cv.width), c = canvas(Math.round(cv.width * k), Math.round(cv.height * k)), x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(cv, 0, 0, c.width, c.height);
  const b64 = c.toDataURL('image/jpeg', .9).split(',')[1], bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return { bytes: u, w: c.width, h: c.height }; }

function buildPdf(pages) { // pages: [{ ops: string (latin1), images: [{ name, img }] }]
  const enc = s => { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; };
  const parts = [], offsets = []; let len = 0; const push = u => { parts.push(u); len += u.length; };
  const objs = []; const add = body => { objs.push(body); return objs.length; };
  const fonts = { F1: add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'), F2: add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'), F3: add('<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>') };
  const pagesId = add(null), kids = [];
  for (const p of pages) {
    const xo = p.images.map(({ name, img }) => `/${name} ${add({ stream: img.bytes, dict: `<< /Type /XObject /Subtype /Image /Width ${img.w} /Height ${img.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.bytes.length} >>` })} 0 R`).join(' ');
    const cs = add({ stream: enc(p.ops), dict: `<< /Length ${p.ops.length} >>` });
    kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 ${fonts.F1} 0 R /F2 ${fonts.F2} 0 R /F3 ${fonts.F3} 0 R >> /XObject << ${xo} >> >> /Contents ${cs} 0 R >>`));
  }
  objs[pagesId - 1] = `<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
  const info = add(`<< /Producer (Logo Lab - brandsmith) /Title ${pdfStr(t('pdfTitle') + ' - ' + (state.name || ''))} >>`);
  const catalog = add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
  push(enc('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
  objs.forEach((o, i) => { offsets[i] = len; if (typeof o === 'string') push(enc(`${i + 1} 0 obj\n${o}\nendobj\n`)); else { push(enc(`${i + 1} 0 obj\n${o.dict}\nstream\n`)); push(o.stream); push(enc('\nendstream\nendobj\n')); } });
  const xref = len; let x = `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`; offsets.forEach(o => { x += String(o).padStart(10, '0') + ' 00000 n \n'; });
  push(enc(x + `trailer\n<< /Size ${objs.length + 1} /Root ${catalog} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF`));
  buildPdf.last = parts; return new Blob(parts, { type: 'application/pdf' });
}

function exportPdf(dry) {
  if (!DATA || M.empty) return;
  const PW = 595.28, PH = 841.89, MX = 44; const rgb = h => hexToRgb(h).map(v => (v / 255).toFixed(3)).join(' ');
  const C = { ink: '#15171c', muted: '#646b78', rule: '#dadee5', accent: '#d0126c', ok: '#12784f', warn: '#a65f00', bad: '#c0261b' };
  const pages = []; let ops = '', imgs = [], n = 0, y = 0;
  const T = (s, x, yy, size = 10, font = 'F1', color = C.ink) => { ops += `BT /${font} ${size} Tf ${rgb(color)} rg ${x.toFixed(2)} ${(PH - yy).toFixed(2)} Td ${pdfStr(s)} Tj ET\n`; };
  const R = (x, yy, w, h, color, stroke) => { ops += stroke ? `${rgb(color)} RG 0.6 w ${x.toFixed(2)} ${(PH - yy - h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re S\n` : `${rgb(color)} rg ${x.toFixed(2)} ${(PH - yy - h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f\n`; };
  const IM = (cv, x, yy, w) => { const img = jpegOf(cv), h = w * img.h / img.w, name = 'Im' + (++n); imgs.push({ name, img }); ops += `q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${(PH - yy - h).toFixed(2)} cm /${name} Do Q\n`; return h; };
  const para = (s, x, yy, width, size = 10, font = 'F1', color = C.ink, lh = 1.42) => { const lines = wrap(s, size, width, font === 'F2'); lines.forEach((l, i) => T(l, x, yy + i * size * lh, size, font, color)); return lines.length * size * lh; };
  const date = new Date().toLocaleDateString(LANG === 'it' ? 'it-IT' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const footer = () => { R(MX, PH - 40, PW - 2 * MX, .6, C.rule); T(t('pdfGen', { d: date }), MX, PH - 26, 7.5, 'F1', C.muted); T(t('pdfPage', { n: pages.length + 1 }), PW - MX - 40, PH - 26, 7.5, 'F1', C.muted); };
  const newPage = () => { footer(); pages.push({ ops, images: imgs }); ops = ''; imgs = []; y = 56; };

  // page 1: verdict
  T(state.studio ? state.studio.toUpperCase() : 'LOGO LAB', MX, 56, 8, 'F2', C.accent); T(state.studio ? t('pdfTitle') : t('pdfTitle'), MX + textW(state.studio ? state.studio.toUpperCase() : 'LOGO LAB', 8, true) + 12, 56, 8, 'F1', C.muted);
  T(state.sample ? t('sampleTag') : (state.name || DATA.file), MX, 88, 24, 'F2'); T(`${t('pdfFile')}: ${DATA.file}  ·  ${date}`, MX, 106, 9, 'F1', C.muted);
  const spec = canvas(900, 900), sx = spec.getContext('2d'); sx.fillStyle = '#fff'; sx.fillRect(0, 0, 900, 900); drawLogo(sx, 170, 170, 560, 560);
  sx.strokeStyle = '#d0126c'; sx.lineWidth = 3; for (const [a, b, dx, dy] of [[40, 40, 1, 1], [860, 40, -1, 1], [40, 860, 1, -1], [860, 860, -1, -1]]) { sx.beginPath(); sx.moveTo(a, b + 60 * dy); sx.lineTo(a, b); sx.lineTo(a + 60 * dx, b); sx.stroke(); }
  R(MX - .5, 129.5, 221, 221, C.rule, true); IM(spec, MX, 130, 220);
  const lv = level(), lc = C[lv]; const vx = MX + 244;
  if (state.client) { T(t('minSize').toUpperCase(), vx, 142, 8, 'F2', C.muted); T(M.minSize + ' px', vx, 196, 46, 'F2', lc); } else { T(t('scal').toUpperCase(), vx, 142, 8, 'F2', C.muted); T(M.score.toFixed(1), vx, 196, 46, 'F2', lc); T('/ 10', vx + textW(M.score.toFixed(1), 46, true) + 6, 196, 14, 'F1', C.muted); }
  if (state.client) T(t(stampKey()), vx, 240, 12, 'F2', lc); else { T(t('minSize').toUpperCase(), vx, 224, 8, 'F2', C.muted); T(M.minSize + ' px', vx, 246, 20, 'F2'); T(t(stampKey()), vx + 90, 244, 10, 'F2', lc); }
  // ruler
  const rx = vx, rw = PW - MX - vx, pos = v => rx + (Math.log2(clamp(v, 16, 256)) - 4) / 4 * rw;
  R(rx, 268, rw, 6, '#eef0f3'); R(pos(M.minSizeRaw), 268, rx + rw - pos(M.minSizeRaw), 6, C.ok); R(pos(M.minSizeRaw) - .8, 262, 1.6, 18, C.accent);
  for (const s of [16, 24, 32, 48, 64, 128, 256]) T(String(s), pos(s) - textW(String(s), 7) / 2, 290, 7, 'F3', C.muted);
  y = 312; y += para(verdictText(), vx, y, rw, 9.5) + 6;
  y = Math.max(y, 372);
  if (state.studio) { T(t('prepared', { s: state.studio }), MX, 368, 8.5, 'F1', C.muted); }
  if (state.note.trim()) { y += 4; T(t('noteH').toUpperCase(), MX, y + 10, 8, 'F2', C.accent); y += 22; y += para(state.note.trim(), MX, y, PW - 2 * MX, 10) + 10; }
  // measures + stats table
  const rows = [[t('thin'), pctOfMark(M.tInk) + ' ' + t('ofMark') + (M.limit === 'strokes' && M.minSizeRaw > 16 ? ' · ' + t('limiting') : '')], [t('gap'), pctOfMark(M.tGap) + ' ' + t('ofMark') + (M.limit === 'gaps' && M.minSizeRaw > 16 ? ' · ' + t('limiting') : '')],
    [t('fid16'), Math.round((1 - clamp(M.err16)) * 100) + '%'], [t('fid32'), Math.round((1 - clamp(M.err32)) * 100) + '%'], [t('parts'), M.fg256 + ' -> ' + M.fg32], [t('fill'), Math.round(M.fill * 100) + '%'], [t('sym'), Math.round(M.symH * 100) + '%'], [t('neg'), Math.round(M.negRatio * 100) + '% · ' + M.holes + ' ' + t(M.holes === 1 ? 'counter' : 'counters')]];
  const colW = (PW - 2 * MX) / 2; if (state.client) rows.splice(2);
  rows.forEach(([k, v], i) => { const cx = MX + (i % 2) * colW, cy = y + ((i / 2) | 0) * 34; R(cx, cy, colW - 12, .6, C.rule); T(k, cx, cy + 14, 8.5, 'F1', C.muted); T(v, cx, cy + 27, 10, 'F3'); });
  y += Math.ceil(rows.length / 2) * 34 + 14; y += para(t('heur'), MX, y, PW - 2 * MX, 8, 'F1', C.muted) + 10;
  // checklist summary of flagged tests
  const flagged = TESTS.filter(T2 => LIVE[T2.id] && (LIVE[T2.id].status === 'warn' || LIVE[T2.id].status === 'bad'));
  if (flagged.length) { T((LANG === 'it' ? 'Da controllare' : 'To check').toUpperCase(), MX, y + 10, 8, 'F2', C.accent); y += 24;
    for (const f of flagged) { T('•', MX, y, 10, 'F2', C.warn); y += para(t(TITLES[f.id]) + ((LIVE[f.id].readout || []).length ? ': ' + LIVE[f.id].readout.join(' · ') : ''), MX + 12, y, PW - 2 * MX - 12, 9.5); } }

  // figure pages: two columns, grouped by section (continue on page 1 when there is room)
  y += 18; if (y > PH - 230) newPage();
  const gutter = 18, fw = (PW - 2 * MX - gutter) / 2;
  for (const [sec, title] of SECTIONS) {
    const items = TESTS.filter(T2 => T2.sec === sec && LIVE[T2.id] && LIVE[T2.id].canvas && !(state.client && ['curv', 'anch', 'weight', 'neg'].includes(T2.id))); if (!items.length) continue;
    if (y > PH - 340) newPage();
    T(t(title), MX, y + 14, 14, 'F2'); y += 30; let col = 0, rowH = 0;
    for (const T2 of items) {
      const live = LIVE[T2.id], wide = T2.wide, w = wide ? PW - 2 * MX : fw, ih = w * live.canvas.height / live.canvas.width;
      const noteLines = wrap(t(NOTES[T2.id]), 8, w, false), chips = (live.readout || []).join('  ·  ');
      const h = 16 + ih + 8 + (chips ? 13 : 0) + noteLines.length * 11 + 14;
      if (wide && col === 1) { y += rowH; col = 0; rowH = 0; }
      if (y + h > PH - 52) { newPage(); col = 0; rowH = 0; }
      const x0 = MX + col * (fw + gutter); let yy = y;
      T(t(TITLES[T2.id]), x0, yy + 10, 10, 'F2'); if (live.status && live.status !== 'ok') T('!', x0 + w - 6, yy + 10, 10, 'F2', C[live.status]); yy += 16;
      R(x0 - .5, yy - .5, w + 1, ih + 1, C.rule, true); IM(live.canvas, x0, yy, w); yy += ih + 8;
      if (chips) { T(chips, x0, yy + 8, 8, 'F3', C.ink); yy += 13; }
      noteLines.forEach((l, i) => T(l, x0, yy + 8 + i * 11, 8, 'F1', C.muted));
      rowH = Math.max(rowH, h);
      if (wide || col === 1) { y += rowH; col = 0; rowH = 0; } else col = 1;
    }
    if (col === 1) { y += rowH; }
    y += 8;
  }
  footer(); pages.push({ ops, images: imgs });
  const blob = buildPdf(pages); if (dry) { let s = ''; for (const p of buildPdf.last) for (let i = 0; i < p.length; i++) s += String.fromCharCode(p[i]); return btoa(s); }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = ((state.name || 'logo').toLowerCase().replace(/[^a-z0-9]+/g, '-') || 'logo') + '-logo-lab.pdf'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(t('pdfMade'));
}
