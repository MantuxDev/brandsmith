<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logo Lab</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cstyle%3E.i%7Bfill:%2315171c%7D.s%7Bstroke:%2315171c%7D@media(prefers-color-scheme:dark)%7B.i%7Bfill:%23fff%7D.s%7Bstroke:%23fff%7D%7D%3C/style%3E%3Ccircle class='s' cx='24' cy='24' r='11.5' fill='none' stroke-width='4.5'/%3E%3Crect class='i' x='21.75' y='1' width='4.5' height='5.5' rx='1'/%3E%3Crect class='i' x='21.75' y='41.5' width='4.5' height='5.5' rx='1'/%3E%3Crect class='i' x='1' y='21.75' width='5.5' height='4.5' rx='1'/%3E%3Crect class='i' x='41.5' y='21.75' width='5.5' height='4.5' rx='1'/%3E%3Ccircle cx='24' cy='24' r='4' fill='%23d0126c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: test bench. Left column = the specimen and its settings plus an index of the tests; right = verdict
   first (score, minimum size, what to check), then the tests grouped by question. Sections that pass are folded.
   Accent = process magenta, used for marks, links and selection only. */
:root {
  --paper: #eef0f3; --sheet: #ffffff; --sheet-2: #f6f7f9; --ink: #15171c; --ink-2: #3a3f49; --muted: #646b78;
  --rule: #dadee5; --rule-2: #c5cad3; --accent: #d0126c; --accent-ink: #9e0d52; --accent-soft: #fdf3f7;
  --ok: #12784f; --ok-soft: #dff3ea; --ok-ink: #0e5f3f;
  --warn: #a65f00; --warn-soft: #fbefdc; --warn-ink: #8a4f00; --warn-line: #f0d3a6; --warn-bg: #fffaf2;
  --bad: #c0261b; --bad-soft: #fbe4e1; --bad-ink: #9c1f16;
  --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-text: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px; --shadow: 0 1px 2px rgba(21,23,28,.06), 0 8px 24px -12px rgba(21,23,28,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #101216; --sheet: #191c22; --sheet-2: #20242b; --ink: #eceef2; --ink-2: #c7ccd5; --muted: #9aa1ae;
  --rule: #2a2f38; --rule-2: #3a404b; --accent: #ff4f9b; --accent-ink: #ff7ab3; --accent-soft: #3a1527;
  --ok: #4fd09a; --ok-soft: #12291f; --ok-ink: #6fe0b0; --warn: #f0a540; --warn-soft: #33240e; --warn-ink: #f6bd6b;
  --warn-line: #5a4320; --warn-bg: #241c10; --bad: #ff7b6e; --bad-soft: #3a1714; --bad-ink: #ff998e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #101216; --sheet: #191c22; --sheet-2: #20242b; --ink: #eceef2; --ink-2: #c7ccd5; --muted: #9aa1ae;
  --rule: #2a2f38; --rule-2: #3a404b; --accent: #ff4f9b; --accent-ink: #ff7ab3; --accent-soft: #3a1527;
  --ok: #4fd09a; --ok-soft: #12291f; --ok-ink: #6fe0b0; --warn: #f0a540; --warn-soft: #33240e; --warn-ink: #f6bd6b;
  --warn-line: #5a4320; --warn-bg: #241c10; --bad: #ff7b6e; --bad-soft: #3a1714; --bad-ink: #ff998e;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--f-text) }
button, input, textarea { font: inherit; color: inherit }
a { color: var(--accent) } a:hover { color: var(--accent-ink) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 1360px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)) }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.mark { width: 22px; height: 22px; flex: none; color: var(--ink) }

/* header */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); border-bottom: 1px solid var(--rule) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--sheet) }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding-block: 12px }
.brand { display: flex; align-items: center; gap: 10px; font: 700 18px/1 var(--f-display) }
.filechip { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet-2); min-width: 0; max-width: 420px }
.filechip img { width: 16px; height: 16px; object-fit: contain; flex: none }
.filechip .n { font: 12px/1.2 var(--f-mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.filechip .m { font-size: 12px; color: var(--muted); white-space: nowrap }
.grow { flex: 1 1 0 }
.lang { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden }
.lang button { border: 0; padding: 0 12px; min-width: 44px; height: 44px; background: var(--sheet); color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--sheet) }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap }
.btn:hover { border-color: var(--ink-2); color: var(--ink) }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--sheet) }
.btn.primary:hover { background: var(--ink-2); color: var(--sheet) }
.btn svg { width: 16px; height: 16px; flex: none }
[hidden] { display: none !important }

/* layout */
.app { display: grid; grid-template-columns: minmax(300px, 340px) minmax(0, 1fr); gap: 24px; align-items: start; padding-block: 24px 40px }
.card { background: var(--sheet); border-radius: var(--r); box-shadow: var(--shadow) }
aside.side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 92px }
.specimen { overflow: hidden }
.proof { height: 240px; display: grid; place-items: center; border-bottom: 1px solid var(--rule); transition: background .2s }
.proof img { max-width: 62%; max-height: 62% }
.spec-body { padding: 16px; display: flex; flex-direction: column; gap: 14px }
.row-sb { display: flex; align-items: center; justify-content: space-between; gap: 10px }
.lbl { font-size: 13px; color: var(--muted) }
.swatches { display: flex; gap: 2px }
.sw { width: 44px; height: 44px; border: 0; padding: 0; background: transparent; border-radius: 10px; display: grid; place-items: center; cursor: pointer }
.sw span { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--rule-2) }
.sw[aria-pressed="true"] span { box-shadow: 0 0 0 2px var(--sheet), 0 0 0 4px var(--accent) }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2) }
.field input[type=text], .field textarea { min-height: 44px; padding: 10px 12px; border: 1px solid var(--rule-2); border-radius: 8px; font-size: 14px; font-weight: 400; color: var(--ink); background: var(--sheet) }
.field textarea { resize: vertical; min-height: 84px }
.colors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.colorpick { position: relative; display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 12px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; cursor: pointer }
.colorpick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer }
.colorpick .chip { width: 28px; height: 28px; border-radius: 6px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08) }
.colorpick b { display: block; font-weight: 600 }
.colorpick code { font: 12px var(--f-mono); color: var(--muted) }
nav.index { padding: 8px }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
nav.index .eyebrow { display: block; padding: 10px 10px 6px }
nav.index a { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 8px; color: var(--ink); text-decoration: none }
nav.index a:hover { background: var(--sheet-2) }
nav.index a.warn { background: var(--warn-bg) }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ok) }
.dot.warn { background: var(--warn) } .dot.bad { background: var(--bad) }
nav.index .nm { flex: 1 1 0; font-weight: 500 }
nav.index .ct { font-size: 12px; font-weight: 600; color: var(--ok-ink) }
nav.index a.warn .ct { color: var(--warn-ink) }
.content { display: flex; flex-direction: column; gap: 24px; min-width: 0 }

/* verdict */
.verdict { padding: 28px; display: flex; flex-wrap: wrap; gap: 28px; scroll-margin-top: 92px }
.v-main { flex: 3 1 380px; display: flex; flex-direction: column; gap: 18px; min-width: 0 }
.v-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px; border-radius: 13px; font-size: 12px; font-weight: 600 }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none }
.pill.ok { background: var(--ok-soft); color: var(--ok-ink) } .pill.warn { background: var(--warn-soft); color: var(--warn-ink) } .pill.bad { background: var(--bad-soft); color: var(--bad-ink) }
.pill.plain::before { display: none }
.v-nums { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 32px }
.v-thumb { display: none; width: 96px; height: 96px; border-radius: 12px; background: var(--sheet-2); place-items: center; flex: none }
.v-thumb img { max-width: 72%; max-height: 72% }
.score { display: flex; align-items: baseline; gap: 6px }
.score b { font: 700 88px/.9 var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.score span { font-size: 22px; color: var(--muted) }
.minsize { display: flex; flex-direction: column; gap: 2px; padding-bottom: 6px }
.minsize span { font-size: 12px; color: var(--muted) }
.minsize b { font: 700 34px/1 var(--f-display); font-variant-numeric: tabular-nums }
.ruler { display: flex; flex-direction: column; gap: 6px }
.ruler .track { position: relative; height: 10px; border-radius: 5px; background: var(--sheet-2); box-shadow: inset 0 0 0 1px var(--rule) }
.ruler .below { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px 0 0 5px; background: var(--bad-soft) }
.ruler .above { position: absolute; right: 0; top: 0; bottom: 0; border-radius: 0 5px 5px 0; background: var(--ok) }
.ruler .pin { position: absolute; top: -5px; width: 2px; height: 20px; margin-left: -1px; background: var(--ink) }
.ruler .ticks { position: relative; height: 16px; font: 11px/16px var(--f-mono); color: var(--muted) }
.ruler .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap }
.ruler .ticks span:first-child { transform: none } .ruler .ticks span:last-child { transform: translateX(-100%) }
.lead { margin: 0; font-size: 16px; line-height: 1.55; color: var(--ink-2); max-width: 62ch; text-wrap: pretty }
.tocheck { flex: 2 1 280px; display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 12px; background: var(--sheet-2); border: 1px solid var(--rule); min-width: 0 }
.tocheck h2 { margin: 0; font-size: 15px; font-weight: 600 }
.tc-item { display: flex; gap: 12px; padding: 14px; border-radius: 10px; background: var(--sheet); border: 1px solid var(--warn-line); text-decoration: none; color: var(--ink) }
.tc-item:hover { color: var(--ink); border-color: var(--warn) }
.tc-item.bad { border-color: #f2c6c1 }
.bang { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--warn-soft); color: var(--warn-ink); display: grid; place-items: center; font-weight: 700 }
.tc-item.bad .bang { background: var(--bad-soft); color: var(--bad-ink) }
.tc-item .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.tc-item .tx b { font-weight: 600 } .tc-item .tx span { font-size: 13px; color: var(--ink-2) }
.tc-item .go { font-size: 13px; font-weight: 600; color: var(--accent); margin-top: 4px }
.passed { display: flex; align-items: center; gap: 10px; padding: 6px 4px 0; font-size: 13px; color: var(--ink-2) }
.tick { width: 20px; height: 20px; border-radius: 50%; background: var(--ok-soft); color: var(--ok-ink); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none }
.metrics { flex: 1 1 100%; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin: 0 }
.metrics div { background: var(--sheet); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.metrics dt { font-size: 12px; color: var(--muted) } .metrics dd { margin: 0; font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums }
.fine { flex: 1 1 100%; margin: 0; font-size: 12px; color: var(--muted) }
.how summary { cursor: pointer; display: inline; color: var(--accent); font-weight: 600 }
.how p { margin: 8px 0 0; max-width: 75ch; color: var(--muted) }

/* filter */
.filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between }
.seg { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--sheet); border: 1px solid var(--rule) }
.seg button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-weight: 600; cursor: pointer }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet) }
.seg.small { padding: 2px; border-radius: 8px } .seg.small button { min-height: 36px; padding: 0 10px; font-size: 12px; border-radius: 6px }
.hint { font-size: 13px; color: var(--muted) }
.chips { display: none }

/* sections */
.section { scroll-margin-top: 92px }
.section > .sh { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--rule) }
.section h2 { margin: 0; font: 700 22px/1.2 var(--f-display) }
.section .intro { flex: 1 1 200px; font-size: 13px; color: var(--muted) }
.section .body { padding: 24px; display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 20px }
.fold { width: 100%; text-align: left; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 18px 24px; min-height: 64px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); color: var(--ink); cursor: pointer; scroll-margin-top: 92px }
.fold:hover { border-color: var(--rule-2) }
.fold .t { font: 700 20px/1.2 var(--f-display) }
.fold .list { flex: 1 1 240px; font-size: 13px; color: var(--muted) }
.fold .open { font-size: 13px; font-weight: 600; color: var(--accent) }
.closebar { display: flex; justify-content: flex-end; padding: 0 24px 20px }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; min-height: 44px; padding: 0 4px }

/* tests */
.test { display: flex; flex-direction: column; gap: 10px; min-width: 0; scroll-margin-top: 92px }
.test.wide, .test.flag { grid-column: 1 / -1 }
.test.flag { padding: 20px; border-radius: 12px; border: 1px solid var(--warn-line); background: var(--warn-bg) }
.test.flag.bad { border-color: #f2c6c1; background: #fdf6f5 }
:root[data-theme="dark"] .test.flag.bad { background: #2a1513; border-color: #5a2722 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .test.flag.bad { background: #2a1513; border-color: #5a2722 } }
.test .th { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
.test h3 { margin: 0; font-size: 15px; font-weight: 600; margin-right: auto }
.test.flag h3 { font-size: 16px }
.stage { border-radius: 10px; overflow: hidden; background: var(--sheet-2); border: 1px solid var(--rule); line-height: 0 }
.stage canvas { width: 100%; height: auto; display: block }
.test .note { margin: 0; font-size: 13px; color: var(--muted); text-wrap: pretty }
.readout { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font: 500 12px/1 var(--f-mono); padding: 6px 8px; border-radius: 6px; background: var(--sheet-2); color: var(--ink-2); font-variant-numeric: tabular-nums }
.whatfix { display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 14px; color: var(--ink-2) }
.whatfix strong { color: var(--ink) }
.slider { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
.slider input { flex: 1 1 160px; min-height: 44px; accent-color: var(--accent) }
.slider output { font: 500 12px var(--f-mono); color: var(--ink-2); white-space: nowrap }
pre.src { margin: 0; max-height: 300px; overflow: auto; padding: 12px; border-radius: 10px; background: var(--sheet-2); border: 1px solid var(--rule); font: 12px/1.55 var(--f-mono); white-space: pre-wrap; word-break: break-all; color: var(--ink-2) }
.kit { display: flex; flex-wrap: wrap; gap: 8px }
footer.page { padding: 8px 0 24px; font-size: 12px; color: var(--muted) }

/* empty state */
.loading { max-width: 520px; margin: 0 auto; padding-block: 96px 64px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center }
.loading .spin { width: 72px; height: 72px; color: var(--ink); animation: ll-spin 1.1s linear infinite; will-change: transform }
.loading .spin .c { fill: var(--accent) }
@keyframes ll-spin { to { transform: rotate(360deg) } }
.loading h1 { margin: 0; font: 700 26px/1.2 var(--f-display) }
.loading .ld-stage { font-size: 15px; color: var(--ink-2); min-height: 1.4em }
.loading .ld-bar { width: 100%; max-width: 360px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden }
.loading .ld-bar i { display: block; height: 100%; width: 8%; background: var(--accent); border-radius: 3px; transition: width .2s }
.loading .ld-bar.indet i { width: 30%; animation: ll-slide 1.2s ease-in-out infinite; will-change: transform }
@keyframes ll-slide { from { transform: translateX(-100%) } to { transform: translateX(340%) } }
.loading .note { font-size: 13px; color: var(--muted) }
@media (prefers-reduced-motion: reduce) { .loading .spin { animation-duration: 3s } .loading .ld-bar.indet i { animation-duration: 3s } }
.empty { max-width: 1040px; margin: 0 auto; padding-block: 56px 48px; display: flex; flex-direction: column; gap: 32px }
.empty .hero { display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center }
.empty h1 { margin: 0; font: 700 44px/1.05 var(--f-display); letter-spacing: -.02em; text-wrap: balance }
.empty .hero p { margin: 0; font-size: 17px; color: var(--ink-2); max-width: 620px }
.drop { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 56px 24px; border: 2px dashed var(--rule-2); border-radius: 18px; background: var(--sheet); text-align: center; cursor: pointer }
.drop:hover, body.dragging .drop { border-color: var(--accent) }
.drop .ic { width: 72px; height: 72px; border-radius: 18px; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent) }
.drop .ic svg { width: 32px; height: 32px }
.drop .big { font: 700 24px/1.2 var(--f-display) }
.drop .sm { font-size: 14px; color: var(--muted) }
.drop .fake { min-height: 48px; padding: 0 22px; border-radius: 10px; background: var(--ink); color: var(--sheet); font-weight: 600; display: inline-flex; align-items: center; gap: 8px }
.drop .fake svg { width: 18px; height: 18px; flex: none } .drop .fake { white-space: nowrap }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0 }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px }
.three div { padding: 20px; border-radius: var(--r); background: var(--sheet); display: flex; flex-direction: column; gap: 6px }
.three b { font-size: 15px } .three span { font-size: 13px; color: var(--ink-2) }

/* export panel */
.ex-back { position: fixed; inset: 0; z-index: 60; display: flex; background: rgba(17,19,23,.82) }
.ex-back[hidden] { display: none }
.ex-prev { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px; min-width: 0; overflow: hidden }
.ex-prev .eyebrow { color: #c7ccd5 }
.page1 { width: 440px; max-width: 100%; aspect-ratio: 210 / 297; background: #ffffff; color: #15171c; border-radius: 4px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.6); padding: 32px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; font-size: 11px }
.page1 .ph { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: #646b78; gap: 10px }
.page1 .ph b { color: #15171c }
.page1 .pt { display: flex; align-items: center; gap: 14px }
